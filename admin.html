<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JGC BAS SAC · Panel de Administración</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f4f7fc; color: #1e2b3a; display: flex; height: 100vh; overflow: hidden; }
    :root { --verde: #017464; --azul: #244061; --gris: #3d4f5e; }

    #login-screen { position: fixed; inset: 0; background: var(--azul); display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .login-box { background: #fff; padding: 2.5rem; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; }
    .login-box h2 { color: var(--azul); margin-bottom: 0.5rem; font-size: 1.8rem; }
    .login-box input { width: 100%; padding: 0.9rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
    .login-box button { width: 100%; padding: 0.9rem; background: var(--verde); color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; }
    .error-msg { color: #e63946; font-size: 0.85rem; margin-top: 0.5rem; display: none; }

    #app-container { display: none; width: 100%; height: 100vh; }
    .sidebar { width: 260px; background: var(--azul); color: #fff; display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { padding: 1.5rem; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .sidebar-header h2 { font-size: 1.5rem; }
    .sidebar-header p { font-size: 0.8rem; color: #BEDDB8; }
    .sidebar-nav { flex: 1; padding: 1rem 0; overflow-y: auto; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 1rem 1.5rem; color: #cbdae9; text-decoration: none; cursor: pointer; border-left: 4px solid transparent; transition: 0.2s; }
    .nav-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
    .nav-item.active { background: rgba(255,255,255,0.1); color: #fff; border-left-color: var(--verde); font-weight: 700; }
    .nav-item i { width: 20px; text-align: center; }
    .sidebar-footer { padding: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1); text-align: center; }
    .sidebar-footer button { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 0.5rem; width: 100%; border-radius: 6px; cursor: pointer; }

    .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #f4f7fc; }
    #module-container { flex: 1; overflow-y: auto; padding: 2rem; }
    #module-loader { display: none; text-align: center; padding: 4rem; color: var(--gris); }
    #module-loader i { font-size: 2rem; color: var(--verde); animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2><i class="fas fa-lock" style="color: var(--verde);"></i> JGC BAS SAC</h2>
        <p style="color:#64748b; margin-bottom:1.5rem; font-size:0.9rem;">Panel de Administración CRM</p>
        <input type="text" id="username" placeholder="Usuario">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="login()">Ingresar</button>
        <div class="error-msg" id="login-error">Credenciales incorrectas.</div>
    </div>
</div>

<div id="app-container">
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>JGC BAS</h2>
            <p>Panel de Administración</p>
        </div>
        <div class="sidebar-nav">
            <a class="nav-item active" onclick="loadModule('dashboard.html', this)"><i class="fas fa-chart-pie"></i> Dashboard & Clientes</a>
            <a class="nav-item" onclick="loadModule('quotes.html', this)"><i class="fas fa-file-invoice-dollar"></i> Oportunidades y Cotizaciones</a>
            <a class="nav-item" onclick="loadModule('ai.html', this)"><i class="fas fa-brain"></i> Gerente IA (Qwen)</a>
            <a class="nav-item" onclick="loadModule('logistics.html', this)"><i class="fas fa-boxes"></i> Logística e Inventario</a>
        </div>
        <div class="sidebar-footer">
            <button onclick="logout()"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</button>
        </div>
    </div>
    <div class="main-content">
        <div id="module-container">
            <div id="module-loader"><i class="fas fa-spinner"></i><br>Cargando módulo...</div>
            <div id="module-content"></div>
        </div>
    </div>
</div>

<script>
    function login() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        if (u === 'catherine' && p === 'jgc2026') {
            localStorage.setItem('jgc_session', 'true');
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';
            loadModule('dashboard.html', document.querySelector('.nav-item'));
        } else {
            document.getElementById('login-error').style.display = 'block';
        }
    }

    function logout() {
        localStorage.removeItem('jgc_session');
        location.reload();
    }

    async function loadModule(moduleName, element) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        if (element) element.classList.add('active');

        const loader = document.getElementById('module-loader');
        const content = document.getElementById('module-content');
        loader.style.display = 'block';
        content.innerHTML = '';

        try {
            const response = await fetch('modulos/' + moduleName);
            if (!response.ok) throw new Error('Error al cargar módulo');
            const html = await response.text();
            
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;
            
            // Extraer scripts antes de inyectar HTML
            const scripts = tempDiv.querySelectorAll('script');
            const scriptTexts = [];
            scripts.forEach(s => {
                scriptTexts.push(s.textContent);
                s.remove();
            });
            
            // Inyectar HTML limpio
            content.innerHTML = tempDiv.innerHTML;
            
            // Ejecutar scripts después de que el DOM esté listo
            setTimeout(() => {
                scriptTexts.forEach(code => {
                    try {
                        const script = document.createElement('script');
                        script.textContent = code;
                        document.body.appendChild(script);
                    } catch(e) {
                        console.error('Error en script del módulo:', e);
                    }
                });
            }, 100);
            
            loader.style.display = 'none';
        } catch(e) {
            content.innerHTML = '<div style="color:#e63946; padding:2rem; text-align:center;">❌ Error al cargar módulo: ' + e.message + '</div>';
            loader.style.display = 'none';
        }
    }

    if (localStorage.getItem('jgc_session') === 'true') {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-container').style.display = 'flex';
        loadModule('dashboard.html', document.querySelector('.nav-item'));
    }
</script>
</body>
</html>
